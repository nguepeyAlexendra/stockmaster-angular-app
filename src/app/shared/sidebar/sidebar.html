<div class="app-container">
  <!-- Sidebar fixe -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-wrapper">
        <div class="logo-icon">
          <img src="assets/logo.png" alt="Logo" />
        </div>
        <div class="logo-texts">
          <h3 class="brand-name">StockMaster</h3>
          <span class="brand-subtitle">Administration</span>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">MENU</div>
      
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">⊞</span>
        <span>Dashboard</span>
      </a>
      
      <a routerLink="/produits" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📦</span>
        <span>Produits</span>
      </a>
      
      <a routerLink="/categories" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🏷️</span>
        <span>Catégories</span>
      </a>
      
      <a routerLink="/ventes" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🛒</span>
        <span>Ventes</span>
      </a>
      
      <a routerLink="/factures" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📄</span>
        <span>Factures</span>
      </a>
      
      <a routerLink="/fournisseurs" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">🚚</span>
        <span>Fournisseurs</span>
      </a>
      
      <a routerLink="/entrees-stock" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📥</span>
        <span>Entrées stock</span>
      </a>
      
      <div class="nav-section-label">ADMINISTRATION</div>
      
      <a routerLink="/utilisateurs" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">👤</span>
        <span>Utilisateurs</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button (click)="logout()" class="logout-btn">
        <span class="nav-icon">🚪</span>
        <span>Déconnexion</span>
      </button>
      
      <div class="user-profile">
        <div class="user-avatar">
          <span>{{ userInitials }}</span>
        </div>
        <div class="user-details">
          <div class="user-name">{{ userName }}</div>
          <div class="user-role">Administrateur</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="top-header">
      <div class="header-left">
        <h2 class="page-title">Tableau de bord — Admin</h2>
        <span class="current-date">{{ currentDate }}</span>
      </div>
      
      <div class="header-right">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Rechercher une vente..." />
        </div>
        
        <button class="icon-btn">
          <span>🔔</span>
        </button>
        
        <button class="icon-btn">
          <span>🌙</span>
        </button>
      </div>
    </header>

    <div class="content-body">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
