<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <span></span><span></span>
    </div>
    <span class="logo-txt">STOCKMASTER</span>
  </div>

  <p class="nav-section">NAVIGATION</p>

  <div class="nav-item" [class.active]="activePage === 'dashboard'" (click)="navigateTo('dashboard')">
    <i class="ti ti-layout-dashboard"></i><span>Dashboard</span>
  </div>
  <div class="nav-item" [class.active]="activePage === 'produits'" (click)="navigateTo('produits')">
    <i class="ti ti-package"></i><span>Produits</span>
  </div>
  <div class="nav-item" [class.active]="activePage === 'categories'" (click)="navigateTo('categories')">
    <i class="ti ti-tag"></i><span>Catégories</span>
  </div>
  <div class="nav-item" [class.active]="activePage === 'ventes'" (click)="navigateTo('ventes')">
    <i class="ti ti-shopping-cart"></i><span>Ventes</span>
  </div>
  <div class="nav-item" [class.active]="activePage === 'factures'" (click)="navigateTo('factures')">
    <i class="ti ti-receipt"></i><span>Factures</span>
  </div>
  <div class="nav-item" [class.active]="activePage === 'clients'" (click)="navigateTo('clients')">
    <i class="ti ti-users"></i><span>Clients</span>
  </div>
  <div class="nav-item" [class.active]="activePage === 'fournisseurs'" (click)="navigateTo('fournisseurs')">
    <i class="ti ti-truck"></i><span>Fournisseurs</span>
  </div>
  <div class="nav-item" [class.active]="activePage === 'entrees-stock'" (click)="navigateTo('entrees-stock')">
    <i class="ti ti-arrow-up-circle"></i><span>Entrées stock</span>
  </div>
  <div class="nav-item" [class.active]="activePage === 'rapports'" (click)="navigateTo('rapports')">
    <i class="ti ti-chart-bar"></i><span>Rapports</span>
  </div>

  <div class="sidebar-bottom">
    <div class="nav-item nav-logout" (click)="logout()">
      <i class="ti ti-logout"></i><span>Déconnexion</span>
    </div>
  </div>
</aside>
